# JSON syntax is valid YAML. Reconstructed from applied configuration.
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "analytics-service",
    "namespace": "togglemaster"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app": "analytics-service"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "analytics-service"
        }
      },
      "spec": {
        "containers": [
          {
            "envFrom": [
              {
                "configMapRef": {
                  "name": "analytics-config"
                }
              }
            ],
            "image": "302795277290.dkr.ecr.sa-east-1.amazonaws.com/togglemaster-analytics-service:latest",
            "imagePullPolicy": "Always",
            "livenessProbe": {
              "httpGet": {
                "path": "/health",
                "port": "http"
              },
              "initialDelaySeconds": 15,
              "periodSeconds": 20
            },
            "name": "analytics-service",
            "ports": [
              {
                "containerPort": 8005,
                "name": "http"
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/health",
                "port": "http"
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 10
            },
            "resources": {
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              }
            }
          }
        ],
        "serviceAccountName": "analytics-service"
      }
    }
  }
}
