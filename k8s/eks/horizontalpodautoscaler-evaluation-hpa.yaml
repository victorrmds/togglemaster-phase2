{
  "apiVersion": "autoscaling/v2",
  "kind": "HorizontalPodAutoscaler",
  "metadata": {
    "name": "evaluation-hpa",
    "namespace": "togglemaster"
  },
  "spec": {
    "behavior": {
      "scaleDown": {
        "stabilizationWindowSeconds": 300
      }
    },
    "maxReplicas": 3,
    "metrics": [
      {
        "resource": {
          "name": "cpu",
          "target": {
            "averageUtilization": 60,
            "type": "Utilization"
          }
        },
        "type": "Resource"
      }
    ],
    "minReplicas": 1,
    "scaleTargetRef": {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "name": "evaluation-service"
    }
  }
}
