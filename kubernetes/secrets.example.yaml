# PLACEHOLDERS ONLY. Do not apply as-is.
# Copy to secrets.yaml (ignored by Git) and supply actual values privately.
# Kubernetes converts stringData into base64-encoded data on storage.
# Base64 is not encryption. Never commit the populated copy.
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: togglemaster
type: Opaque
stringData:
  DATABASE_URL: "postgres://REPLACE_USER:REPLACE_URL_ENCODED_PASSWORD@REPLACE_RDS_HOST:5432/auth_db?sslmode=require"
  MASTER_KEY: "REPLACE_WITH_PRIVATE_MASTER_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: flag-secret
  namespace: togglemaster
type: Opaque
stringData:
  DATABASE_URL: "postgres://REPLACE_USER:REPLACE_URL_ENCODED_PASSWORD@REPLACE_RDS_HOST:5432/flags_db?sslmode=require"
---
apiVersion: v1
kind: Secret
metadata:
  name: targeting-secret
  namespace: togglemaster
type: Opaque
stringData:
  DATABASE_URL: "postgres://REPLACE_USER:REPLACE_URL_ENCODED_PASSWORD@REPLACE_RDS_HOST:5432/targeting_db?sslmode=require"
---
apiVersion: v1
kind: Secret
metadata:
  name: evaluation-secret
  namespace: togglemaster
type: Opaque
stringData:
  SERVICE_API_KEY: "REPLACE_WITH_API_KEY_ISSUED_BY_EKS_AUTH"
